<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CampMetrix 360°</title>
  
  <!-- Стили и библиотеки -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    html, body {
      background-color: #090d16;
      -webkit-tap-highlight-color: transparent;
    }
    .touch-scroll { -webkit-overflow-scrolling: touch; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="text-slate-100 font-sans selection:bg-indigo-500 selection:text-white pb-20 md:pb-6">

  <!-- Контейнер для всплывающих уведомлений -->
  <div id="toastContainer" class="fixed top-3 right-3 left-3 sm:left-auto sm:w-80 z-[9999] flex flex-col gap-2 pointer-events-none"></div>

  <!-- Экран гостевого экспресс-опроса (по QR-коду) -->
  <div id="guestSurveyView" class="hidden min-h-screen bg-slate-950 p-4 flex flex-col items-center justify-center">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6">
      <div class="text-center space-y-1">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-500 to-indigo-600 flex items-center justify-center font-black text-white text-xl mx-auto">CM</div>
        <h2 class="text-xl font-bold text-white pt-2" id="guestSurveyTitle">Оценка вожатого</h2>
        <p class="text-xs text-slate-400" id="guestSurveySubtitle">Экспресс-отзыв 360°</p>
      </div>

      <form id="guestFeedbackForm" class="space-y-4">
        <input type="hidden" id="guestCampId">
        <input type="hidden" id="guestStaffId">
        <input type="hidden" id="guestType">
        <div id="guestQuestionsList" class="space-y-3.5"></div>
        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-sm shadow-lg shadow-indigo-950 transition">
          Отправить оценку
        </button>
      </form>

      <div id="guestSuccessBox" class="hidden text-center py-8 space-y-3">
        <div class="w-14 h-14 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-2xl border border-emerald-500/40">✓</div>
        <h3 class="text-lg font-bold text-white">Спасибо!</h3>
        <p class="text-xs text-slate-400">Отзыв сохранён и пересчитан в профиле смены.</p>
      </div>
    </div>
  </div>

  <!-- Основное приложение -->
  <div id="adminApp" class="flex flex-col min-h-screen">
    
    <!-- Шапка приложения -->
    <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800/80 sticky top-0 z-30 px-4 py-3">
      <div class="max-w-6xl mx-auto flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-indigo-600 flex items-center justify-center font-black text-white text-base shadow-md shadow-indigo-950">
            CM
          </div>
          <div>
            <h1 class="text-base font-bold text-white tracking-tight leading-tight flex items-center gap-2">
              CampMetrix 360°
              <span id="cloudStatusBadge" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
            </h1>
            <p class="text-[11px] text-slate-400">Реестр команды и оценка эффективности</p>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <button id="btnExportXlsx" class="hidden sm:flex px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-semibold items-center gap-1.5 border border-slate-700 transition">
            <i data-lucide="file-spreadsheet" class="w-4 h-4 text-emerald-400"></i>
            <span>Excel</span>
          </button>
          <button id="btnStartEvalHeader" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow-md shadow-indigo-950">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>Оценить</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Основной контейнер -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-3 sm:p-6 space-y-5">
      
      <!-- Экран 1: Реестр команды -->
      <section id="view-registry" class="space-y-4">
        <!-- Сводные метрики -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2.5 sm:gap-4">
          <div class="bg-slate-900/80 border border-slate-800 p-3.5 rounded-2xl">
            <span class="text-[11px] text-slate-400 uppercase font-semibold">В команде</span>
            <div class="text-2xl font-black text-white mt-0.5" id="metricTotalStaff">0</div>
          </div>
          <div class="bg-slate-900/80 border border-slate-800 p-3.5 rounded-2xl">
            <span class="text-[11px] text-amber-400 uppercase font-semibold">Золотой фонд</span>
            <div class="text-2xl font-black text-amber-300 mt-0.5" id="metricCoreStaff">0</div>
          </div>
          <div class="bg-slate-900/80 border border-slate-800 p-3.5 rounded-2xl">
            <span class="text-[11px] text-indigo-400 uppercase font-semibold">Слётов в базе</span>
            <div class="text-2xl font-black text-indigo-300 mt-0.5" id="metricTotalCamps">0</div>
          </div>
          <div class="bg-slate-900/80 border border-slate-800 p-3.5 rounded-2xl">
            <span class="text-[11px] text-rose-400 uppercase font-semibold">Стоп-лист</span>
            <div class="text-2xl font-black text-rose-400 mt-0.5" id="metricStopList">0</div>
          </div>
        </div>

        <!-- Поиск и фильтры -->
        <div class="bg-slate-900/70 border border-slate-800/80 p-3 rounded-2xl flex flex-wrap gap-2.5 items-center justify-between">
          <div class="relative flex-1 min-w-[200px]">
            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-slate-500"></i>
            <input type="text" id="registrySearchInput" placeholder="Поиск по ФИО, позывному..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
          </div>
          <div class="flex items-center gap-2">
            <select id="registryRoleFilter" class="bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 text-xs text-slate-300 focus:outline-none focus:border-indigo-500">
              <option value="all">Все роли</option>
              <option value="pedagogical">Вожатые</option>
              <option value="organizer">Организаторы</option>
              <option value="technical">Техники / Медиа</option>
              <option value="stop">Стоп-лист</option>
            </select>
            <button id="btnOpenAddStaff" class="px-3.5 py-2 bg-indigo-600/20 hover:bg-indigo-600 text-indigo-300 hover:text-white border border-indigo-500/30 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
              <i data-lucide="user-plus" class="w-4 h-4"></i>
              <span class="hidden sm:inline">Добавить</span>
            </button>
          </div>
        </div>

        <!-- Список сотрудников (карточки) -->
        <div id="staffListContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
      </section>

      <!-- Экран 2: Слёты и смены -->
      <section id="view-camps" class="hidden space-y-4">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-base font-bold text-white">Выездные слёты и смены</h2>
            <p class="text-xs text-slate-400">Формирование составов, дат и распределение пар</p>
          </div>
          <button id="btnOpenAddCamp" class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-md shadow-indigo-950">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>Новый слёт</span>
          </button>
        </div>

        <div id="campsListContainer" class="grid grid-cols-1 md:grid-cols-2 gap-3.5"></div>
      </section>

    </main>

    <!-- Нижняя мобильная панель навигации (Bottom Navigation) -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur border-t border-slate-800/80 px-6 py-2 flex items-center justify-around z-40">
      <button onclick="window.switchTab('registry')" id="bottomNavRegistry" class="flex flex-col items-center gap-1 text-indigo-400 font-semibold text-[10px]">
        <i data-lucide="users" class="w-5 h-5"></i>
        <span>Команда</span>
      </button>
      <button onclick="window.openEvaluationModal()" class="w-12 h-12 -mt-5 bg-gradient-to-tr from-amber-500 to-indigo-600 rounded-full flex items-center justify-center text-white shadow-lg shadow-indigo-950">
        <i data-lucide="award" class="w-6 h-6"></i>
      </button>
      <button onclick="window.switchTab('camps')" id="bottomNavCamps" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white text-[10px]">
        <i data-lucide="tent" class="w-5 h-5"></i>
        <span>Слёты</span>
      </button>
    </nav>
  </div>

  <!-- Модальные окна (подгружаются через модули) -->
  <div id="modalContainer"></div>

  <!-- Точка входа в систему (ES Module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
